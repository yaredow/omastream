name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Python Syntax Check
        run: |
          for script in $(find scripts -type f); do
            if head -n 1 "$script" | grep -qi 'python'; then
              echo "Checking Python script: $script"
              python3 -m py_compile "$script"
            fi
          done

      - name: ShellCheck Bash Scripts
        run: |
          for script in $(find scripts -type f); do
            if head -n 1 "$script" | grep -qEi 'bash|sh'; then
              echo "Checking Shell script: $script"
              shellcheck "$script"
            fi
          done
