name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package Plugin
        run: |
          mkdir omastream
          # Package explicit plugin files to prevent shipping cache and dev artifacts
          cp -r components providers scripts services views BarWidget.qml OmaStreamOverlay.qml PlaybackService.qml manifest.json README.md LICENSE preview.png omastream/
          # Ensure no pycache is accidentally packaged
          find omastream -type d -name "__pycache__" -exec rm -rf {} +
          find omastream -name "*.pyc" -delete
          tar -czvf omastream-plugin.tar.gz omastream

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: omastream-plugin.tar.gz
