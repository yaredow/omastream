name: Bug Report
description: Create a report to help us improve omaStream
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this?
      placeholder: |
        1. Open Discover
        2. Search for 'xyz'
        3. Click on the second result
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
  - type: input
    id: omastream_version
    attributes:
      label: omaStream Version (or commit)
      description: Which version of this plugin are you using? (e.g., v0.1.0 or latest master commit)
    validations:
      required: true
  - type: input
    id: omarchy_version
    attributes:
      label: Omarchy / Quickshell Version
      description: Which versions of Omarchy and Quickshell are you running? (e.g., Omarchy 4.0.0, Quickshell 0.1.0)
    validations:
      required: true
  - type: input
    id: ytdlp_version
    attributes:
      label: yt-dlp Version
      description: Run `yt-dlp --version` in your terminal.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste any relevant shell logs or console output here. (Please redact any personal paths or secrets).
      render: shell
