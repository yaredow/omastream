name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Plugin
        run: |
          mkdir omastream
          # Copy everything except .git and .github
          rsync -av --exclude='.git' --exclude='.github' --exclude='omastream' ./ omastream/
          tar -czvf omastream-plugin.tar.gz omastream

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: omastream-plugin.tar.gz
