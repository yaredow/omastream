name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck


      - name: Python Syntax Check
        run: |
          for script in scripts/omastream-download scripts/omastream-relay scripts/omastream-search scripts/omastream-upload-time; do
            python3 -m py_compile "$script"
          done

      - name: ShellCheck Bash Scripts
        run: |
          for script in scripts/omastream-formats scripts/omastream-resolve scripts/detect-browser.sh; do
            shellcheck "$script"
          done
